name: chicago-taxi-trust

x-app: &app
  image: chicago-taxi-trust:local
  build: .
  environment: &environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__PARALLELISM: '1'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
    AIRFLOW__WEBSERVER__WORKERS: '1'
    AIRFLOW__WEBSERVER__SECRET_KEY: local-taxi-demo-change-before-sharing
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    S3_ENDPOINT: http://objectstore:9000
    S3_ACCESS_KEY: taxiadmin
    S3_SECRET_KEY: taxi-local-demo-password
    S3_BUCKET: taxi-lake
    START_DATE: ${START_DATE:-2023-01-01}
    END_DATE: ${END_DATE:-2023-01-02}
    PAGE_SIZE: ${PAGE_SIZE:-5000}
    SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
  volumes:
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  objectstore:
    image: rustfs/rustfs:1.0.3
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: taxiadmin
      RUSTFS_SECRET_KEY: taxi-local-demo-password
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_OBS_LOG_DIRECTORY: /tmp
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - objectstore-data:/data
    mem_limit: 768m

  airflow-init:
    <<: *app
    environment:
      <<: *environment
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    command: version
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g

  airflow-webserver:
    <<: *app
    command: webserver
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: 1200m

  airflow-scheduler:
    <<: *app
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      objectstore:
        condition: service_started
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 5g

  report:
    <<: *app
    entrypoint: []
    command: [/opt/pipeline-env/bin/streamlit, run, /opt/project/src/reporting/report.py, --server.address=0.0.0.0, --server.port=8501, --browser.gatherUsageStats=false]
    ports:
      - '127.0.0.1:8501:8501'
    depends_on:
      objectstore:
        condition: service_started
    mem_limit: 768m

volumes:
  postgres-data:
  objectstore-data:
  airflow-logs:
